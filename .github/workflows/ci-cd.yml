name: Build Website

on:
  push:
    branches: [ main, develop, main_temp ]
  pull_request:
    branches: [ main ]

env:
  AWS_REGION: eu-central-1
  ECR_REGISTRY: 058264235144.dkr.ecr.eu-central-1.amazonaws.com
  ECR_REPOSITORY: solo-website
  CODEARTIFACT_DOMAIN: solo-platform
  CODEARTIFACT_DOMAIN_OWNER: "058264235144"

jobs:
  test:
    runs-on: ubuntu-latest
    # if: github.event_name == 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.17.0'
        cache: 'npm'

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Configure CodeArtifact authentication
      run: |
        CODEARTIFACT_AUTH_TOKEN=$(aws codeartifact get-authorization-token \
          --domain ${{ env.CODEARTIFACT_DOMAIN }} \
          --domain-owner ${{ env.CODEARTIFACT_DOMAIN_OWNER }} \
          --region ${{ env.AWS_REGION }} \
          --query authorizationToken \
          --output text)

        REGISTRY_URL="https://${{ env.CODEARTIFACT_DOMAIN }}-${{ env.CODEARTIFACT_DOMAIN_OWNER }}.d.codeartifact.${{ env.AWS_REGION }}.amazonaws.com/npm/npm-solo/"

        # Create .npmrc file
        echo "@solo:registry=$REGISTRY_URL" > .npmrc
        echo "//${{ env.CODEARTIFACT_DOMAIN }}-${{ env.CODEARTIFACT_DOMAIN_OWNER }}.d.codeartifact.${{ env.AWS_REGION }}.amazonaws.com/npm/npm-solo/:_authToken=$CODEARTIFACT_AUTH_TOKEN" >> .npmrc
        echo "save-exact=true" >> .npmrc
        echo "legacy-peer-deps=true" >> .npmrc
        echo "always-auth=true" >> .npmrc

    - name: Install dependencies
      run: npm ci --legacy-peer-deps

    - name: Rebuild node-sass
      run: npm rebuild node-sass

    - name: Run lint
      run: npm run lint

    - name: Run tests
      run: npm run test



